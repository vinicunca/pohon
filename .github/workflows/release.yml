name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      matrix:
        os: [ubuntu-latest] # macos-latest, windows-latest
        node: [24]

    env:
      NUXT_GITHUB_TOKEN: ${{ secrets.NUXT_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test run

      - name: Publish
        run: ./scripts/release.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  notify-docs:
    if: startsWith(github.ref, 'refs/tags/v2.0.')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
    steps:
      - name: Request tagged docs import
        if: env.GH_TOKEN != ''
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          jq -n --arg package pohon --arg tag "$RELEASE_TAG" \
            '{event_type: "docs-package-release", client_payload: {package: $package, tag: $tag}}' \
            | gh api repos/vinicunca/docs/dispatches --method POST --input -
