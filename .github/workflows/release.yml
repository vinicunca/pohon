name: release

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    environment: npm

    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        os: [ubuntu-latest] # macos-latest, windows-latest
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        shell: bash
        run: pnpm i --frozen-lockfile

      - name: Update npm (Trusted Publishers requires npm >= 11.5.1)
        # Workaround for npm/cli#9151: Node 22's bundled npm 10.9.7 is broken
        # (missing promise-retry). Pin to 11.11.0 which installs successfully.
        run: npm install -g npm@11.11.0

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test run

      # Must publish from repo root for provenance to work with OIDC
      - name: Publish to npm
        run: npm publish --access public --provenance
