name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # npm trusted publisher: vinicunca / pohon / release.yml (allow npm publish).
    if: github.repository == 'vinicunca/pohon'
    uses: vinicunca/workflows/.github/workflows/release.yml@main

    permissions:
      contents: write
      id-token: write

    with:
      # release-it already creates the GitHub release.
      github-release: false
      publish: true
      tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
      # Validate before publishing; prepack builds the package again for npm.
      build: |
        node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Release tag must match package.json version")'
        pnpm run dev:prepare
        pnpm run typecheck
        pnpm run test run
