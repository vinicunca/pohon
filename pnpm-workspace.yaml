ignoreWorkspaceRootCheck: true

minimumReleaseAge: 0

packages:
  - ./
  - cli
  # - docs
  - playgrounds/nuxt
  - playgrounds/vue
  - playgrounds/repl

linkWorkspacePackages: true

allowBuilds:
  '@parcel/watcher': false
  '@vercel/speed-insights': false
  better-sqlite3: true
  esbuild: false
  puppeteer: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: false

overrides:
  '@nuxt/kit': ^4.5.1
  '@nuxt/test-utils': 4.0.2
  '@types/node': 25.3.0
  c12: ^3.3.4
  h3: 1.15.11
  pohon-ui: workspace:*
  typescript: ^6.0.3
  unplugin: 3.3.0
  unplugin-auto-import: 21.0.0
